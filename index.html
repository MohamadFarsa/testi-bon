<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Moharez Digital Card</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06090f;--card:#0d1117;--card2:#111820;--border:#1a2435;--border2:#243040;--accent:#38bdf8;--accent2:#6366f1;--text:#e2e8f0;--muted:#4a5a72;--muted2:#6b7e96;--sans:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(600px at 20% 30%,rgba(56,189,248,.06) 0%,transparent 60%),radial-gradient(400px at 80% 70%,rgba(99,102,241,.07) 0%,transparent 60%);pointer-events:none;z-index:0;}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px rgba(56,189,248,.07),0 40px 100px rgba(0,0,0,.7);animation:rise .8s cubic-bezier(.22,1,.36,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.hero{position:relative;padding:36px 32px 28px;background:linear-gradient(160deg,#0d1117,#101822);border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
.avatar-ring{position:relative;z-index:1;width:110px;height:110px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:16px;box-shadow:0 0 30px rgba(56,189,248,.25);}
.avatar-ring img,.avatar-ring>div{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top center;display:block;border:2px solid var(--card);}
.status{position:absolute;bottom:6px;right:6px;width:18px;height:18px;background:#22c55e;border-radius:50%;border:3px solid var(--card);z-index:2;}
.status::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(34,197,94,.4);animation:ripple 2s infinite;}
@keyframes ripple{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.name{position:relative;z-index:1;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.role{position:relative;z-index:1;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted2);letter-spacing:.08em;}
.bio{position:relative;z-index:1;margin-top:10px;font-size:12px;color:var(--muted2);line-height:1.6;max-width:280px;}
.tags{position:relative;z-index:1;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
.tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;padding:4px 10px;border-radius:100px;border:1px solid rgba(56,189,248,.2);color:var(--accent);background:rgba(56,189,248,.07);}
.player{position:relative;z-index:1;margin-top:20px;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.player-top{display:flex;align-items:center;gap:12px;}
.play-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(56,189,248,.35);transition:transform .15s;}
.play-btn:hover{transform:scale(1.08);}
.play-btn svg{width:18px;height:18px;display:block;margin-left:2px;}
.track-info{flex:1;min-width:0;}
.track-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:2px;}
.wave{display:flex;align-items:center;gap:2px;height:24px;flex-shrink:0;}
.wave-bar{width:3px;border-radius:2px;background:var(--accent);opacity:.4;}
.wave.active .wave-bar{animation:wb .8s ease-in-out infinite alternate;}
.wave-bar:nth-child(1){height:6px;animation-delay:.0s}.wave-bar:nth-child(2){height:14px;animation-delay:.1s}.wave-bar:nth-child(3){height:20px;animation-delay:.2s}.wave-bar:nth-child(4){height:10px;animation-delay:.3s}.wave-bar:nth-child(5){height:16px;animation-delay:.15s}.wave-bar:nth-child(6){height:8px;animation-delay:.25s}.wave-bar:nth-child(7){height:18px;animation-delay:.05s}
@keyframes wb{from{transform:scaleY(.4);opacity:.4}to{transform:scaleY(1);opacity:1}}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.prog-bar-bg{flex:1;height:4px;background:var(--border2);border-radius:4px;cursor:pointer;}
.prog-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .3s linear;pointer-events:none;}
.prog-time{font-family:var(--mono);font-size:10px;color:var(--muted2);white-space:nowrap;}
.socials{display:flex;gap:10px;justify-content:center;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--card2);flex-wrap:wrap;}
.soc-btn{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--border2);transition:transform .2s,border-color .2s,box-shadow .2s;}
.soc-btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.soc-btn svg{display:block;width:21px;height:21px;}
.soc-tg{background:rgba(41,182,246,.1);border-color:rgba(41,182,246,.25);}.soc-tg:hover{border-color:rgba(41,182,246,.6);}
.soc-ig{background:rgba(225,48,108,.1);border-color:rgba(225,48,108,.25);}.soc-ig:hover{border-color:rgba(225,48,108,.6);}
.soc-wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.25);}.soc-wa:hover{border-color:rgba(37,211,102,.6);}
.soc-gh{background:rgba(201,209,217,.08);border-color:rgba(201,209,217,.15);}.soc-gh:hover{border-color:rgba(201,209,217,.4);}
.soc-li{background:rgba(10,102,194,.1);border-color:rgba(10,102,194,.25);}.soc-li:hover{border-color:rgba(10,102,194,.6);}
.infos{padding:18px 20px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--border);}
.info-row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:background .2s,border-color .2s;}
.info-row:hover{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.25);}
.info-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.info-icon svg{width:17px;height:17px;display:block;}
.info-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;}
.info-value{font-size:13px;font-weight:500;}
.phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.phone-grid .info-row{padding:11px 10px;gap:8px;}
.phone-grid .info-icon{width:30px;height:30px;}
.phone-grid .info-icon svg{width:15px;height:15px;}
.phone-grid .info-value{font-size:12px;word-break:break-all;}
.phone-grid .info-label{font-size:9px;}
.ic-phone{background:rgba(34,197,94,.1);color:#22c55e;}
.ic-phone.ic-phone-alt{background:rgba(56,189,248,.1);color:var(--accent);}
.ic-mail{background:rgba(249,115,22,.1);color:#f97316;}
.ic-loc{background:rgba(168,85,247,.1);color:#a855f7;}
.ic-web{background:rgba(20,184,166,.1);color:#14b8a6;}
.btn-save{margin:18px 20px 22px;display:block;padding:15px;border-radius:15px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 24px rgba(56,189,248,.3);transition:transform .2s,box-shadow .2s;width:calc(100% - 40px);}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(56,189,248,.4);}
.btn-save-inner{display:flex;align-items:center;justify-content:center;gap:10px;}
.foot{padding:13px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);}
.foot-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.foot-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.5;}
.load-state{padding:60px 30px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted2);}
</style></head>
<body>
<div class="page"><div class="card" id="cardRoot">
  <div class="load-state">در حال بارگذاری اطلاعات کارت...</div>
</div></div>

<script>
fetch('data.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('data.json not found'); return r.json(); })
  .then(renderCard)
  .catch(() => {
    document.getElementById('cardRoot').innerHTML =
      '<div class="load-state" style="color:#ef4444;">اطلاعات کارت پیدا نشد.<br/>مطمئن شو فایل data.json کنار index.html آپلود شده.</div>';
  });

function esc(s){ return (s==null?'':String(s)); }

function renderCard(data){
  const name    = data.name || 'نام';
  const job     = data.job || '';
  const bio     = data.bio || '';
  const tags    = data.tags || [];
  const phones  = (data.phones || []).filter(p => p && p.value);
  const emails  = (data.emails || []).filter(e => e && e.value);
  const websites= (data.websites || []).filter(w => w && w.value);
  const social  = data.social || {};
  const loc     = data.location || {};
  const music   = data.music || {};
  const t       = data.toggles || {};
  const photoBase64 = data.photoBase64 || '';

  const np = name.trim().split(' ');
  const n1 = np.slice(0,-1).join(' ') || np[0];
  const n2 = np.length > 1 ? np[np.length-1] : '';

  const avatarHTML = photoBase64
    ? `<img src="${photoBase64}" alt="${esc(name)}"/>`
    : `<div style="width:100%;height:100%;border-radius:50%;background:#151d29;display:flex;align-items:center;justify-content:center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4a5a72" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;

  const tagsHTML = tags.map(tg => `<span class="tag">${esc(tg)}</span>`).join('');
  const bioHTML  = (t.bio !== false && bio) ? `<p class="bio">${esc(bio)}</p>` : '';

  const showMusic = t.music !== false;
  const playerHTML = (showMusic && music.fileBase64) ? `
    <div class="player">
      <div class="player-top">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24" fill="#fff"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <div class="track-info">
          <div class="track-name">${esc(music.trackName || 'آهنگ')}</div>
          <div class="track-artist">${esc(music.trackArtist || '')}</div>
        </div>
        <div class="wave" id="wave">
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
      </div>
      <div class="progress-wrap">
        <span class="prog-time" id="curTime">0:00</span>
        <div class="prog-bar-bg" id="progBg" onclick="seek(event)"><div class="prog-bar-fill" id="progFill"></div></div>
        <span class="prog-time" id="durTime">0:00</span>
      </div>
    </div>
    <audio id="audio" preload="auto"><source src="data:audio/mpeg;base64,${music.fileBase64}" type="audio/mpeg"/></audio>` : '';

  const socBtns = [];
  if(social.telegram) socBtns.push(`<a class="soc-btn soc-tg" href="https://t.me/${social.telegram}" target="_blank"><svg viewBox="0 0 24 24" fill="#29B6F6"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.17 13.674l-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.98.885z"/></svg></a>`);
  if(social.instagram) socBtns.push(`<a class="soc-btn soc-ig" href="https://instagram.com/${social.instagram}" target="_blank"><svg viewBox="0 0 24 24" fill="#E91E8C"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>`);
  phones.forEach(p => { if(p.label === 'واتساپ') socBtns.push(`<a class="soc-btn soc-wa" href="https://wa.me/${p.value.replace(/\D/g,'')}" target="_blank"><svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>`); });
  if(social.github) socBtns.push(`<a class="soc-btn soc-gh" href="https://github.com/${social.github}" target="_blank"><svg viewBox="0 0 24 24" fill="#C9D1D9"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>`);
  if(social.linkedin) socBtns.push(`<a class="soc-btn soc-li" href="https://linkedin.com/in/${social.linkedin}" target="_blank"><svg viewBox="0 0 24 24" fill="#0a66c2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>`);

  const infoRows = [];
  const phoneIcon = alt => `<div class="info-icon ic-phone${alt?' ic-phone-alt':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 .99h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16z"/></svg></div>`;
  if(phones.length >= 2){
    const cells = phones.map((p,i) => `<a class="info-row" href="tel:${p.value}">${phoneIcon(i%2===1)}<div><div class="info-label">${esc(p.label)}</div><div class="info-value">${esc(p.value)}</div></div></a>`).join('');
    infoRows.push(`<div class="phone-grid">${cells}</div>`);
  } else {
    phones.forEach(p => infoRows.push(`<a class="info-row" href="tel:${p.value}">${phoneIcon(false)}<div><div class="info-label">${esc(p.label)}</div><div class="info-value">${esc(p.value)}</div></div></a>`));
  }
  if(t.email !== false) emails.forEach(e => {
    infoRows.push(`<a class="info-row" href="mailto:${e.value}"><div class="info-icon ic-mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div><div class="info-label">${esc(e.label)}</div><div class="info-value">${esc(e.value)}</div></div></a>`);
  });
  if(t.website !== false) websites.forEach(w => {
    const display = w.value.replace(/^https?:\/\//,'').replace(/\/$/,'');
    infoRows.push(`<a class="info-row" href="${w.value}" target="_blank"><div class="info-icon ic-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div><div><div class="info-label">${esc(w.label)}</div><div class="info-value">${esc(display)}</div></div></a>`);
  });
  if(t.location !== false && loc.city){
    const locHref = loc.mapLink || `https://maps.google.com/?q=${encodeURIComponent(loc.city + ' ' + (loc.address||''))}`;
    infoRows.push(`<a class="info-row" href="${locHref}" target="_blank"><div class="info-icon ic-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div><div class="info-label">آدرس</div><div class="info-value">${esc(loc.city)}${loc.address?' — '+esc(loc.address):''}</div></div></a>`);
  }

  const vcardLines = ['BEGIN:VCARD','VERSION:3.0',`FN:${name}`,`N:${n2};${n1};;;`,`TITLE:${job}`];
  phones.forEach(p => vcardLines.push(`TEL;TYPE=${p.label}:${p.value}`));
  emails.forEach(e => vcardLines.push(`EMAIL;TYPE=${e.label}:${e.value}`));
  if(loc.city) vcardLines.push(`ADR;TYPE=HOME:;;${loc.address||''};${loc.city};;;`);
  websites.forEach(w => vcardLines.push(`URL:${w.value}`));
  if(social.telegram) vcardLines.push(`X-SOCIALPROFILE;type=telegram:https://t.me/${social.telegram}`);
  if(social.instagram) vcardLines.push(`X-SOCIALPROFILE;type=instagram:https://instagram.com/${social.instagram}`);
  vcardLines.push('END:VCARD');
  window.__vcardData = vcardLines.join('\n');
  window.__vcardFileName = name.replace(/ /g,'_') + '.vcf';

  const saveBtn = (t.vcard !== false) ? `<button class="btn-save" onclick="saveContact()"><div class="btn-save-inner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>افزودن به مخاطبین</div></button>` : '';

  document.getElementById('cardRoot').innerHTML = `
  <div class="hero">
    <div class="avatar-ring">${avatarHTML}<div class="status"></div></div>
    <h1 class="name">${esc(n1)} ${esc(n2)}</h1>
    <p class="role">${esc(job)}</p>
    ${bioHTML}
    <div class="tags">${tagsHTML}</div>
    ${playerHTML}
  </div>
  <div class="socials">${socBtns.join('')}</div>
  <div class="infos">${infoRows.join('')}</div>
  ${saveBtn}
  <div class="foot"><span class="foot-label">NFC Digital Card</span><div class="foot-dot"></div><span class="foot-label" style="font-family:var(--sans);font-size:11px;color:var(--muted2)">© 2025 ${esc(name)}</span></div>`;

  document.title = name;

  if(showMusic && music.fileBase64){
    const audio = document.getElementById('audio');
    const playIcon = document.getElementById('playIcon');
    const wave = document.getElementById('wave');
    const progFill = document.getElementById('progFill');
    const progBg = document.getElementById('progBg');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const PLAY = '<polygon points="5,3 19,12 5,21"/>';
    const PAUSE = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    function fmt(s){ const m = Math.floor(s/60); return m + ':' + (Math.floor(s%60)+'').padStart(2,'0'); }
    audio.addEventListener('loadedmetadata', () => { durTime.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => { if(!audio.duration) return; progFill.style.width = (audio.currentTime/audio.duration*100) + '%'; curTime.textContent = fmt(audio.currentTime); });
    audio.addEventListener('ended', () => { playIcon.innerHTML = PLAY; wave.classList.remove('active'); progFill.style.width = '0%'; curTime.textContent = '0:00'; });
    window.togglePlay = function(){ if(audio.paused){ audio.play(); playIcon.innerHTML = PAUSE; wave.classList.add('active'); } else { audio.pause(); playIcon.innerHTML = PLAY; wave.classList.remove('active'); } };
    window.seek = function(e){ const r = progBg.getBoundingClientRect(); audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; };
  }
}

function saveContact(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([window.__vcardData], {type:'text/vcard'}));
  a.download = window.__vcardFileName;
  a.click();
}
</script>
</body></html>
